[build-system]
requires = ["hatchling>=1.26", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "engstats"
dynamic = ["version"]
authors = [
    {name = "Moses Y.-H. Chan", email = "moses.chan@northwestern.edu"},
    ]
description = "A companion package for probability and statistics for engineers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.2",
    "pandas>=2.2.2",
    "scipy>=1.16.3",
    "statsmodels>=0.14.6",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.2",
    "ipykernel>=6.17.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "jupyter>=1.0"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/engstats"]

[tool.uv]
# rebuild when the commit or tags change so the installed version tracks git
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[dependency-groups]
dev = [
    "uv-publish>=1.4",
    "pytest>=9.0.2"
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7",
    "mkdocstrings[python]>=0.30",
    "ruff>=0.6",
]
